name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to publish (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH_TAG_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      PUBLISH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate dispatch tag input
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format (expected v*.*.*): $TAG" >&2
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Overlay lockfile and verify script from main (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth 1 origin main
          git show FETCH_HEAD:package-lock.json > package-lock.json
          git show FETCH_HEAD:scripts/verify-npm-release.js > scripts/verify-npm-release.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g 'npm@>=11.5.1 <12'

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "No package-lock.json on this ref; using npm install --ignore-scripts"
            npm install --ignore-scripts
          fi

      - name: Verify tag, version, and pack layout
        run: node scripts/verify-npm-release.js

      - name: Skip if version already on registry
        id: skip
        run: |
          VERSION="${PUBLISH_VERSION#v}"
          if npm view "curated-erc@${VERSION}" version 2>/dev/null; then
            echo "curated-erc@${VERSION} already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "curated-erc@${VERSION} not on npm; will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.skip.outputs.skip != 'true'
        run: npm publish --access public
name: Publish

# Normal release: push annotated tag v*.*.* (matches package.json).
# Fallback: merge a change to .github/npm-publish-tag (agent-friendly).
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - ".github/npm-publish-tag"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to publish (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read npm publish request (merge to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/npm-publish-tag

      - name: Resolve publish target
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          validate_tag() {
            if [[ ! "$1" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag format (expected v*.*.*): $1" >&2
              exit 1
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            validate_tag "$TAG"
            echo "overlay=fetch_main" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            validate_tag "$TAG"
            echo "overlay=none" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG=$(tr -d '[:space:]' < .github/npm-publish-tag)
            validate_tag "$TAG"
            echo "overlay=main_sha" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported ref: ${{ github.ref }}" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "PUBLISH_TAG_REF=refs/tags/${TAG}" >> "$GITHUB_ENV"
          echo "PUBLISH_VERSION=${TAG}" >> "$GITHUB_ENV"
          echo "Resolved publish target: ${TAG}"

      - name: Checkout tag sources
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.tag }}
          persist-credentials: false
          fetch-depth: 1

      - name: Overlay lockfile and verify script from main
        if: steps.meta.outputs.overlay != 'none'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.meta.outputs.overlay }}" = "main_sha" ]; then
            git fetch --depth 1 origin "${{ github.sha }}"
            TOOLING="${{ github.sha }}"
          else
            git fetch --depth 1 origin main
            TOOLING="FETCH_HEAD"
          fi
          git show "${TOOLING}:package-lock.json" > package-lock.json
          git show "${TOOLING}:scripts/verify-npm-release.js" > scripts/verify-npm-release.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g 'npm@>=11.5.1 <12'

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "No package-lock.json on this ref; using npm install --ignore-scripts"
            npm install --ignore-scripts
          fi

      - name: Verify tag, version, and pack layout
        run: node scripts/verify-npm-release.js

      - name: Skip if version already on registry
        id: skip
        run: |
          VERSION="${PUBLISH_VERSION#v}"
          if npm view "curated-erc@${VERSION}" version 2>/dev/null; then
            echo "curated-erc@${VERSION} already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "curated-erc@${VERSION} not on npm; will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.skip.outputs.skip != 'true'
        run: npm publish --access public